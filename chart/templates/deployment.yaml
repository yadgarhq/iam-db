apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # OMITTED ENTIRELY WHEN KEDA OWNS THE COUNT, and that guard is the whole point
  # of the condition. KEDA drives a ScaledObject through an HPA, which writes
  # `spec.replicas` on this Deployment; Argo runs with `selfHeal: true` and no
  # `ignoreDifferences` for this field, so a rendered `replicas:` is a value Argo
  # keeps restoring and the autoscaler keeps overwriting. That is not a snap on
  # each upgrade — it is a CONTINUOUS revert loop, in which a scale-up is undone
  # within a sync interval and the load that caused it is served by
  # `replicaCount` pods.
  #
  # Rendering nothing hands the field to the HPA, which is what `minReplicas`
  # exists to floor. `replicaCount` still applies to every deployment that has
  # not enabled autoscaling, which is the chart's own default (D80).
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        # OPT-IN scraping. Prometheus discovers pods by this annotation rather
        # than from a static list, so a new module is scraped by declaring itself
        # rather than by someone remembering to add it centrally (D62's shape).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # POD-level, and distinct from the container block below. Setting only the
      # container context leaves the pod admitting root — runAsNonRoot is the
      # assertion that actually refuses an image which would run as one, rather
      # than trusting the Containerfile to have said so.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          # A published chart carries image.digest and no tag (D65, D61).
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          # EXPLICIT, because the implicit default flips with the tag form and
          # this chart uses both. In git the image is a moving tag (D65), and a
          # moving tag with IfNotPresent means a node serves whatever it cached
          # first — forever, silently, while the deployment looks current.
          #
          # Kubernetes defaults to Always only when the tag is literally `latest`,
          # so the published chart's digest form defaults to IfNotPresent — and a
          # Deployment created from one and later pointed at the other keeps the
          # old policy. That is how a cluster ends up running a build nobody
          # shipped, which is exactly what happened here.
          #
          # Always is correct for both forms: a digest that is already present is
          # not re-downloaded, so this costs nothing where the digest is pinned.
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 50051
          env:
            # THE THREE KNOBS ADR-0569 MOVED OUT OF THE BINARY. Each held a
            # compiled-in default until this chart rendered it, and each literal
            # below is BYTE-IDENTICAL to the default it replaced — which is the
            # whole of what makes the rollout safe. The chart reaches the cluster
            # at merge and the image's digest is pinned minutes later by a
            # separate pipeline, so between the two the new chart runs against
            # the old binary; identical values make that window a no-op.
            #
            # HARDCODED, NOT LIFTED INTO values.yaml, and deliberately. A
            # values-driven value can be overridden to something the old binary
            # never used, and the byte-identity argument above would stop
            # holding. They become values the day an operator needs to move one.
            #
            # THE PORT IS WRITTEN TWICE IN THIS FILE: here, and as
            # `containerPort: 50051` above. Move one and the Service's `grpc`
            # target port finds nothing listening.
            - name: LISTEN
              value: "0.0.0.0:50051"
            # The metrics exporter's address. It has no containerPort: nothing
            # scrapes it through the Service, and the PodMonitor that will scrape
            # it addresses the pod directly.
            - name: METRICS_LISTEN
              value: "0.0.0.0:9090"
            # THE FILE THE DATABASE PASSWORD IS READ FROM, and its directory is
            # the `db-password` mountPath in `volumeMounts` below —
            # `/var/run/secrets/iam-db`. ONE PATH, WRITTEN TWICE IN ONE FILE,
            # which is the point of rendering it here: it used to be written once
            # here and once inside the binary, where nothing made the two move
            # together. Change either and change both.
            - name: DB_PASSWORD_FILE
              value: /var/run/secrets/iam-db/password
            {{- if .Values.tls.enabled }}
            # RENDERED ONLY WHEN TLS IS ASKED FOR, so a deployment that has not
            # cut over sends the binary nothing at all and binds the plaintext
            # listener it always bound. Absence is the default, and the flag is
            # the whole of the lever.
            - name: LISTEN_TLS_ENABLED
              value: "1"
            # PATHS, never an issuer-specific resource (D80). cert-manager writes
            # these files in the reference deployment and a hand-assembled Secret
            # writes them anywhere else; neither the chart nor the binary can
            # tell the difference, which is the point.
            - name: LISTEN_TLS_CERT_FILE
              value: /var/run/secrets/iam-db-tls/tls.pem
            - name: LISTEN_TLS_KEY_FILE
              value: /var/run/secrets/iam-db-tls/tls-key.pem
            {{- end }}
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            # ONE ssl-mode for BOTH connections the pod opens: D7's boot probe
            # and the serving pool. They used to be described separately, and
            # the probe's description carried no ssl-mode at all — so it ran on
            # sqlx's `preferred` default, which falls back to an unencrypted
            # connection, while the pool beside it required TLS.
            #
            # There is deliberately no DB_REQUIRE_TLS here. The binary REFUSES
            # to boot when that key is set, rather than ignoring an operator who
            # used it to ask for a transport guarantee it can no longer give.
            - name: DB_SSL_MODE
              value: {{ .Values.database.sslMode | quote }}
            {{- if .Values.database.sslCaSecret }}
            # THE AUTHORITY the two verifying modes check the engine against.
            # RENDERED ONLY WHEN A SECRET IS NAMED, so a deployment on `required`
            # — the default, which checks no certificate — sends the binary
            # nothing and behaves exactly as before.
            #
            # A PATH, never a PEM (D80), and the binary treats an empty value as
            # no authority rather than as a path it must open. That matters here:
            # Helm renders an unset value as "", so a variable rendered
            # unconditionally would fail the boot of every deployment that never
            # asked for verification.
            - name: DB_SSL_CA_FILE
              value: /var/run/secrets/engine-ca/ca.pem
            {{- end }}
            # D4's arithmetic, both halves of it. The binary refuses to boot
            # when maxConnections x REPLICAS exceeds the engine's ceiling less
            # the five it reserves for an operator, so an engine with a smaller
            # ceiling than stock MariaDB's 151 needs all three to be settable.
            - name: DB_MAX_CONNECTIONS
              value: {{ .Values.database.maxConnections | quote }}
            - name: DB_ENGINE_MAX_CONNECTIONS
              value: {{ .Values.database.engineMaxConnections | quote }}
            # THE NUMBER THE AUTOSCALER MAY REACH, not the number running now.
            # It is the multiplier in the headroom check above, so wiring
            # replicaCount while KEDA scales to autoscaling.maxReplicas would
            # check the arithmetic against a count the autoscaler exceeds. Same
            # expression as gateway's YADGAR_MAX_REPLICAS, for the same reason.
            - name: REPLICAS
              value: {{ if .Values.autoscaling.enabled }}{{ .Values.autoscaling.maxReplicas | quote }}{{ else }}{{ .Values.replicaCount | quote }}{{ end }}
          volumeMounts:
            # THE CONFIGURATION REPOSITORY'S TWO CONFIGMAPS (ADR-0569, ADR-0570,
            # step 2a): the knobs every service reads, and this service's own —
            # empty today, mounted anyway so it is ready the day it is not.
            #
            # DIRECTORIES, NEVER `subPath`. A subPath mount is copied once at
            # container start and kubelet never updates it, so the file would be
            # frozen for the life of the pod while the ConfigMap moved underneath
            # it — the rotation watcher would see nothing and an edited knob
            # would silently never take effect.
            #
            # NO `optional: true`, unlike every Secret mount below. The default,
            # `false`, is what makes kubelet refuse to start this pod at all
            # while `shared` or `iam-db` is absent — `ContainerCreating` naming
            # the missing ConfigMap — rather than starting it with an empty
            # directory the binary would then refuse to read from anyway
            # (ScheduleError::Absent).
            #
            # **`iam-db` IS MOUNTED, AND TODAY IT IS NEITHER READ NOR WATCHED.**
            # `yadgar-lifecycle`'s `Configuration::under(root)` yields exactly one
            # path, `root/shared/shared.yaml`; the crate has no API for a
            # per-service document, so `config-iam-db` is in no process's
            # ADR-0523 watch set. Two things follow and both are deliberate. The
            # `optional: false` reasoning above is true of `shared` and NOT of
            # this one — an absent `iam-db` ConfigMap blocks the pod for no
            # functional benefit, which is accepted so that both mounts are
            # governed by one rule rather than two. And the day this file gains
            # its first knob, Argo will sync it and kubelet will swap it and NO
            # POD WILL RESTART, so the new value never takes effect and nothing
            # reports that — the exact failure ADR-0570 names for `envFrom`,
            # reproduced through a file mount. THE MOUNT IS READY; JOINING THIS
            # DOCUMENT TO THE WATCH SET IS A FURTHER CHANGE, and it belongs in
            # the same pull request as the first iam-db-only knob.
            - name: config-shared
              mountPath: /etc/yadgar/config/shared
              readOnly: true
            - name: config-iam-db
              mountPath: /etc/yadgar/config/iam-db
              readOnly: true
            - name: db-password
              mountPath: /var/run/secrets/iam-db
              readOnly: true
            {{- if .Values.tls.enabled }}
            # A DIRECTORY MOUNT, never subPath. A subPath mount is a one-time
            # copy that kubelet never refreshes, so a renewed certificate would
            # never reach this pod and the listener would keep serving an expired
            # one until somebody restarted it.
            - name: serving-cert
              mountPath: /var/run/secrets/iam-db-tls
              readOnly: true
            {{- end }}
            {{- if .Values.database.sslCaSecret }}
            # A DIRECTORY MOUNT, never subPath — the same argument the serving
            # certificate above makes, and it applies to an authority too. A
            # subPath mount is a one-time copy kubelet never refreshes, so a
            # rotated CA would never reach this pod and the pool would keep
            # verifying against a bundle that no longer signs anything.
            - name: engine-ca
              mountPath: /var/run/secrets/engine-ca
              readOnly: true
            {{- end }}
          # NO readiness probe hitting a /health that returns early. The process
          # does not listen until the capability probe and migrations have both
          # succeeded (D69), so "the port is open" already means "ready" — and a
          # probe that passed earlier than that would report ready for a pod that
          # cannot serve, which under D68 is a pod the HPA adds replicas around.
          #
          # `tcpSocket` needs no change when tls.enabled is set: it completes a
          # TCP connection and no TLS handshake, so kubelet needs neither the
          # certificate nor the authority that signed it.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            # WITHDRAWAL IS `failureThreshold` x `periodSeconds`, AND BOTH ARE
            # WRITTEN HERE (ledger 606). Only `periodSeconds` was ever spelled;
            # `failureThreshold` was kubelet's inherited 3, so the 15s this pod
            # stayed in the Service after it stopped listening was a number
            # nobody chose and `git grep failureThreshold` could not find. 2 x 2
            # makes it 4s, and makes it findable.
            #
            # THE CASE THIS COSTS IS NARROW, and naming it is what keeps the
            # numbers honest. A pod being ROLLED does not pay it: the
            # EndpointSlice controller drops a pod carrying a `deletionTimestamp`
            # from the ready set at deletion, with no probe involved. A CRASHED
            # container does not pay it either: kubelet reports a container that
            # is not running as not ready on the next status sync, ahead of the
            # prober. What pays it is a process that is ALIVE and has stopped
            # listening, which is the self-initiated rotation drain of ADR-0523
            # exactly: `rotate` ends the serve, the listener closes, and the
            # process stays up for up to `DRAIN_BUDGET` with no
            # `deletionTimestamp` for either fast path to see. In that window
            # this probe is the ONLY thing that withdraws this pod.
            #
            # `timeoutSeconds` IS SPELLED BECAUSE `periodSeconds` DEPENDS ON IT.
            # A prober worker ticks once per period and a probe may run for the
            # whole timeout, so the product above is the real window only while
            # the timeout is the smaller number. Raising `timeoutSeconds` past
            # `periodSeconds` stretches the withdrawal silently, and that is the
            # defect this stanza exists to stop repeating.
            #
            # WHY NOT TIGHTER. `failureThreshold: 1` lets one dropped SYN evict a
            # healthy pod, and against `replicaCount: 2` behind a PDB that is
            # half this service for the length of a transient. `periodSeconds: 1`
            # buys the same 4s at threshold 4, but it puts the period ON the
            # timeout, so the arithmetic stops holding the moment a probe has to
            # wait rather than being refused. There is no boot cost either way:
            # failing readiness never kills a pod, and under D69 the port is not
            # open until probe-and-migrate have finished, so failing repeatedly
            # before that is the intended state rather than a regression.
            #
            # WHAT THIS DOES NOT FIX: a wedged process that keeps its socket open
            # answers a `tcpSocket` probe at every threshold. The root fix for
            # the drain window is the process reporting not-ready BEFORE it
            # closes the listener; this is chart-side mitigation for a
            # binary-side gap, and it is filed as such.
            #
            # THIS SERVICE IS HEADLESS, so the withdrawal reaches callers through
            # DNS and `yadgar-dial`'s re-resolution loop, whose `RERESOLVE` is
            # 5s. That tick is added to the window above, which is the reason the
            # probe half of it should not also be 15s: the two together were the
            # dominant term, and 4s + one tick leaves the loop as the dominant
            # one. Retuning `RERESOLVE` is a `dial` change and is not this one.
            timeoutSeconds: 1
            periodSeconds: 2
            failureThreshold: 2
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        # The two ConfigMaps `yadgarhq/config` renders, same reasoning as the
        # mounts above: unconditional, a directory each, never optional.
        - name: config-shared
          configMap:
            name: shared
        - name: config-iam-db
          configMap:
            name: iam-db
        - name: db-password
          secret:
            secretName: {{ .Values.database.passwordSecret }}
        {{- if .Values.tls.enabled }}
        - name: serving-cert
          secret:
            secretName: {{ required "tls.certSecret holds the certificate and private key iam-db serves and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.certSecret }}
            # OPTIONAL, and it means the process MUST NOT START without a usable
            # certificate — optional is simply which error says so. A required
            # mount that cannot be satisfied leaves the pod in ContainerCreating
            # with a FailedMount event about a volume; an optional one mounts an
            # empty directory, the binary finds no file at LISTEN_TLS_CERT_FILE,
            # and it exits naming THAT PATH and saying that TLS was asked for so
            # cleartext is not the answer. Neither starts; only one of them
            # explains itself.
            optional: true
            # BOTH KEYS, because a listener cannot present a certificate it has
            # no key for. Selecting them by name is also what renames whatever
            # the issuer called them to the paths the environment names above.
            items:
              - key: {{ required "tls.certSecretKey names the key inside tls.certSecret that holds the certificate and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.certSecretKey | quote }}
                path: tls.pem
              - key: {{ required "tls.keySecretKey names the key inside tls.certSecret that holds the private key and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.keySecretKey | quote }}
                path: tls-key.pem
        {{- end }}
        {{- if .Values.database.sslCaSecret }}
        - name: engine-ca
          secret:
            secretName: {{ .Values.database.sslCaSecret }}
            # REQUIRED, and this is the one place this chart does NOT copy the
            # serving certificate's `optional: true`. That argument rests on the
            # BINARY opening the file and naming it: `LISTEN_TLS_CERT_FILE` is
            # read here, so an empty mount produces a boot refusal quoting the
            # path. Nothing in this module opens the CA — sqlx does, at connect
            # time, and its `CertificateInput::data` returns a bare
            # `std::io::Error` from `std::fs::read` with NO path in it. The
            # operator would get "error communicating with database: No such file
            # or directory (os error 2)", which names neither the file nor the
            # authority and points at the engine instead.
            #
            # So a FailedMount event, which at least names this volume and the
            # Secret behind it, is the better of the two errors here — the
            # opposite of the serving certificate's case, because the property
            # that made `optional` better there does not hold.
            # ONE KEY, and renaming it is half the point: an RDS bundle, a
            # cert-manager Secret and a hand-assembled one all call this
            # something different, and DB_SSL_CA_FILE names exactly one path.
            items:
              - key: {{ required "database.sslCaSecretKey names the key inside database.sslCaSecret that holds the CA bundle and must be set whenever sslCaSecret is; see the chart's values.yaml" .Values.database.sslCaSecretKey | quote }}
                path: ca.pem
        {{- end }}
