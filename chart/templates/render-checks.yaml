{{/*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS NOTHING.

ONE CHECK PER OPERATOR, NOT ONE PER KIND. Each toggle below renders one kind today,
so the two counts happen to be equal here — they are not the same rule, and the
number this chart asserts is the number of CHECKS.
`scripts/tests/test_render_checks.py` counts the checks DECLARED here and asserts
that number, so a check deleted from this file reddens the suite on the count rather
than letting it quietly exercise one fewer.

EACH CHECK SITS BEHIND ITS OWN TOGGLE, AND THE TOGGLES ARE NOT OR-ED TOGETHER. An
adopter who creates the database and does not autoscale is refused for
mariadb-operator alone, and never for KEDA. `yadgarhq/platform` OR-s three toggles
into one check because all three render objects from the SAME group; these two
render objects from two groups that two different operators provide, so they are two
checks.

THE FILENAME DOES NOT BEGIN WITH AN UNDERSCORE, AND THAT IS LOAD-BEARING. helm
treats `templates/_*` as partials and never renders them, so a `fail` that lived
only in `_require_api.tpl` would never fire. The definition is a partial; the CALL
has to sit in a rendered template. Do not tidy the two into one file.

THE GROUP IS THE OPERATOR'S OWN, and here that needs no argument the way Envoy
Gateway's did in `yadgarhq/platform`: `k8s.mariadb.com/v1alpha1` is registered by
mariadb-operator and by nothing else, so there is no sibling specification a check
could name by mistake. The string is a LITERAL here because
`scripts/tests/test_render_checks.py` reads these arguments off the template to
count and exercise the checks; it is RECORDED a second time in `values.yaml` under
`database.mariadbOperator.apiVersion`, beside the toggle, and the gate that keeps
the two one is
`test_mariadb.py::test_the_render_check_names_the_group_the_values_file_records`.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all. A render check
may only ever sit behind a default-false toggle: `Has` is false for every CRD-backed
group with no cluster, so a check reachable at the defaults would refuse every
offline render in the estate.
*/}}
{{/*
THE SHAPE OF `database.create`, REFUSED BEFORE ANY TOGGLE READS IT.

DECLARED FIRST IN THIS FILE, AND THAT IS THE POINT. Everything below this block, and
`templates/mariadb.yaml` beside it, gates on `{{ if .Values.database.create }}` — a
BARE TRUTHINESS TEST, which is FAIL-OPEN on a string. Measured on helm 3.20.2 and
4.3.0, identically, over ten writable shapes:

  false, 0, null, {}, []   render no MariaDB
  true                     renders one
  "false", "no", "true", 1 render one

So `database.create: "false"` — which reads as OFF to any human, and is what a
`--set-string`, a templated overlay or a quoted values file produces — CREATES A
DATABASE ENGINE. `{}` additionally draws a coalesce warning on both helm lines and
still resolves falsy, so the two shapes an adopter is most likely to write are the
two that say least about what they did.

ADR-0797 IS THE GOVERNING RULE: a values key a helm condition reads, and that some
chart in the tree DECLARES, is validated with `kindIs "bool"` ON THE RAW VALUE. Not
`hasKey` alone — `{}` is present and is not a toggle. Not `kindIs "map"` — that is
ADR-0794's rule for a key whose value is a BLOCK, and this one's value is a bool.
Never on the result of a `default`: sprig's `default` substitutes on an EMPTY value,
so `false`, `0`, `""` and `[]` all collapse into the default and the kind test then
covers exactly the non-empty scalars.

`hasKey` COMES FIRST BECAUSE `kindOf` CANNOT TELL A DELETED KEY FROM AN ABSENT ONE —
it answers `invalid` for both. The distinction is load-bearing here, and it is
MEASURED rather than assumed: helm DELETES a null-valued key when some chart in the
tree declares it, and restores no default. This chart's own `values.yaml` declares
`database.create: false`, so a values file that OMITS the key gets that default back
and `hasKey` is true. `hasKey` is false only when a values file wrote `create:` with
NO VALUE and helm deleted it — the one shape where the chart's default does not
apply and nothing warns. THAT is why an absent key REFUSES here rather than
defaulting false: the absence is not an adopter leaving the key alone, it is an
adopter having written something helm threw away.

THE REFUSAL TEXT MAY NOT QUOTE THE RAISE TEXT IT REPLACES (ADR-0794). A refusal and
a raise both exit 1, so the only thing that tells them apart is the message — and a
refusal that quotes one of go/template's own error markers makes an assertion of the
form "the raise marker is not in this message" false-green for ever.
`scripts/tests/test_render_checks.py::test_the_shape_refusal_does_not_quote_a_raise`
holds the banned markers, in one place, and reads this whole file for them; the
eleven-shape table beside it is the gate on this block.
*/}}
{{- if not (hasKey .Values "database") }}
{{- fail (join "" (list
      "iam-db: `database` is absent from the values, so `database.create` cannot be read. "
      "Helm deletes a null-valued key that a chart in the tree declares, and restores no "
      "default, so a values file writing `database:` with no value leaves this chart with "
      "nothing under it. Write the keys you mean, or omit `database` entirely and this "
      "chart's own defaults apply.")) }}
{{- end }}
{{- if not (hasKey .Values.database "create") }}
{{- fail (join "" (list
      "iam-db: `database.create` is absent. This chart's `values.yaml` declares it false, so "
      "it is missing only when a values file wrote `create:` with NO VALUE — helm deletes a "
      "null-valued key a chart declares and restores no default. Write `database.create: "
      "false` to leave the MariaDB instance uncreated, or `true` to create it.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.database.create) }}
{{- fail (printf (join "" (list
      "iam-db: `database.create` must be true or false and is %s (%s). A string, number, map "
      "or list here is not a toggle: the template gates on bare truthiness, so \"false\", "
      "\"no\", \"true\" and 1 all CREATE a MariaDB instance while {}, 0 and [] do not, and "
      "nothing tells you which one you wrote. Write the bare word `true` or `false`."))
      (kindOf .Values.database.create) (toJson .Values.database.create)) }}
{{- end }}
{{- if .Values.database.create }}
{{- include "iam-db.require-api" (dict
      "context" $
      "apiVersion" "k8s.mariadb.com/v1alpha1"
      "operator" "mariadb-operator"
      "toggle" "database.create") }}
{{- end }}

{{/*
KEDA, BEHIND THE TOGGLE THAT RENDERS THE ScaledObject.

`autoscaling.enabled` renders `templates/scaledobject.yaml`, whose one kind is
`keda.sh/v1alpha1/ScaledObject`. Without this check an adopter who turns autoscaling
on against a cluster with no KEDA renders cleanly and then fails at apply with `no
matches for kind ScaledObject`, half-way through an install — the pod and the Service
applied, the autoscaler absent, and the message naming a kind rather than the
operator to install.

THE GROUP IS THE OPERATOR'S OWN. `keda.sh/v1alpha1` is registered by KEDA and by
nothing else, so there is no sibling specification this could name by mistake — the
argument `yadgarhq/platform`'s Envoy Gateway check has to make, and which does not
arise here. `ScaledObject` is the only kind of that group this chart renders; KEDA
serves five more, and a chart that later renders one of them is covered by this same
check, because the rule is one check per OPERATOR.

NO GATEWAY API CHECK IS ADDED BESIDE IT, and that is a decision rather than an
omission. This chart renders no Gateway API object at all, and the estate's
`gateway.enabled` is the one toggle that defaults TRUE — a render check behind a
default-true toggle refuses every offline render in the estate, which is the exact
failure the opt-in rule below exists to prevent.

THE STRING IS A LITERAL HERE AND IS RECORDED IN `values.yaml` UNDER
`autoscaling.kedaOperator.apiVersion`, read off KEDA as the estate pins it. It has to
be a literal because `scripts/tests/test_render_checks.py` reads these arguments off
the template to count and exercise the checks; the gate that keeps the two one is
`test_every_declared_check_names_the_group_the_values_file_records`.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all. `autoscaling.enabled`
defaults false, for the same reason `database.create` does.
*/}}
{{- if .Values.autoscaling.enabled }}
{{- include "iam-db.require-api" (dict
      "context" $
      "apiVersion" "keda.sh/v1alpha1"
      "operator" "KEDA"
      "toggle" "autoscaling.enabled") }}
{{- end }}
