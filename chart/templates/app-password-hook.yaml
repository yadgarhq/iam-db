{{/*
THE APP ACCOUNT'S PASSWORD, CREATED IN-CLUSTER ONCE (yaadgaar #411, ADR-1141 rules 3-5).

WHY A JOB. mariadb-operator 26.6.0's `User.spec.passwordSecretKeyRef` has no `generate`
field, and a chart-rendered random value changes on every Argo sync, because Argo renders
with `helm template` and `lookup` sees no cluster. Only a writer inside the cluster can
make a stable random value. The Secret is never a chart object, so Argo neither diffs nor
prunes it and `helm uninstall` leaves it in place, by design. Rotation is manual: delete
the Secret and resync.

CREATE, AND NOTHING ELSE. The script makes ONE request, a POST of the Secret. 201: created.
409 AlreadyExists: a Secret of that name exists, and it is never read and never
overwritten. Any other answer, or a transport failure, fails the Job. There is no GET,
and the Role grants `create` on secrets and nothing else (this narrows ADR-1141 rule 4,
which also granted `get` on the one name). So the Job cannot read the live password, and
cannot read back anything it creates. `resourceNames` cannot narrow `create`, because the
authorizer runs before the body is decoded, so the namespace is what bounds it.

THE VALUE NEVER LEAVES THE FILE. 33 bytes of /dev/urandom go through base64 straight
into a JSON body on a memory-backed emptyDir, and curl sends that FILE. The value is
never in a shell variable, an argument or the environment, and nothing prints it. The
response body goes to /dev/null. The service-account token goes in as a header FILE for
the same reason. The password is the 44-character base64 TEXT, stored under
`stringData`, so MariaDB gets a printable password. The body's length is checked before
the POST, so a short read of /dev/urandom or a missing `base64` fails the Job instead of
storing a weak or empty password that 409 would then keep for ever.

THE SECRET'S LABELS NAME WHAT MADE IT and carry no `app.kubernetes.io/instance`: Argo's
label tracking reads that key, and a Secret that looked tracked would be pruned.

A HOOK, SO A FAILURE STOPS THE SYNC: Argo `PreSync` and helm `pre-install,pre-upgrade`.
The RBAC triple is a hook at a lower weight and wave than the Job, because plain objects
are applied after PreSync hooks and the Job would otherwise start under an account that
does not exist yet.

THE RBAC IS DELETED ONLY WHEN THE WHOLE SYNC OPERATION SUCCEEDS. Argo deletes
HookSucceeded hooks on the "all tasks run" path of gitops-engine `sync_context.go`, and
helm deletes `hook-succeeded` hooks only after every hook of the event succeeded
(`pkg/action/hooks.go` at v3.18.4). So the ServiceAccount, Role and RoleBinding outlive a
failed Job, and they also outlive a failed later sync phase, until the next sync's
`BeforeHookCreation` replaces them.

BOUNDED (ADR-0835): the request has a connect timeout and a max time. Three attempts
(`backoffLimit: 2`) x (30s to start + 1 request x 20s) + the controller's 10s and 20s
backoff waits = 180s, under `activeDeadlineSeconds: 300`. `test_app_account.py` pins
that sum off the rendered script.

NO NETWORK POLICY CHANGE. `templates/networkpolicy.yaml` is ingress-only and selects
`app: iam-db`; this pod carries other labels, and there is no default-deny, so its call
to the API server is not blocked.
*/}}
{{- if and .Values.database.create .Values.database.createAppAccount }}
{{- $name := printf "%s-app-password-init" .Chart.Name }}
{{- $secret := .Values.database.appPasswordSecret }}
{{- $metadata := dict "name" $secret "labels" (dict
      "app.kubernetes.io/name" .Chart.Name
      "app.kubernetes.io/component" "app-password"
      "app.kubernetes.io/created-by" $name) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-10"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-10"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-10"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  # Long enough for Argo or helm to read the Job's result before the TTL
  # controller removes it; a success is deleted by the hook policy sooner.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      serviceAccountName: {{ $name }}
      # THE ONLY POD IN THIS CHART THAT MOUNTS A TOKEN: it calls the API. The
      # ServiceAccount itself says false.
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      containers:
        - name: app-password
          image: {{ .Values.database.appPasswordJob.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              umask 077

              api="https://kubernetes.default.svc"
              sa="/var/run/secrets/kubernetes.io/serviceaccount"
              work="/work"
              name={{ $secret | squote }}
              ns="$(cat "$sa/namespace")"

              { printf 'Authorization: Bearer '; cat "$sa/token"; printf '\n'; } > "$work/auth"

              body="/work/secret.json"
              prefix={{ printf "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"type\":\"Opaque\",\"metadata\":%s,\"stringData\":{\"password\":\"" (toJson $metadata) | squote }}
              printf '%s' "$prefix" > "$body"
              head -c 33 /dev/urandom | base64 | tr -d '\n' >> "$body"
              printf '"}}' >> "$body"
              want=$(( ${#prefix} + 44 + 3 ))
              got="$(wc -c < "$body" | tr -d ' ')"
              if [ "$got" -ne "$want" ]; then
                rm -f "$body"
                echo "$name: generated a $got-byte body, expected $want" >&2
                exit 1
              fi

              if ! code="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
                --cacert "$sa/ca.crt" --header "@$work/auth" \
                --header 'Content-Type: application/json' --data-binary "@$body" \
                --output /dev/null --write-out '%{http_code}' \
                "$api/api/v1/namespaces/$ns/secrets")"; then
                rm -f "$body"
                echo "$name: the create request failed in transport (HTTP ${code:-none})" >&2
                exit 1
              fi
              rm -f "$body"
              case "$code" in
                201) echo "$name: created" ;;
                409) echo "$name: already exists, not read and not overwritten" ;;
                *) echo "$name: create answered HTTP $code" >&2; exit 1 ;;
              esac
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
{{- end }}
