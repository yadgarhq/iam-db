{{/*
THE ADMISSION POLICY THAT NARROWS THE HOOK'S `create` (yaadgaar #566, ADR-1142 rule 8).

WHY. The hook Role in `app-password-hook.yaml` grants `create` on secrets, and
`resourceNames` cannot narrow `create`. With code execution in the hook pod, that
account could mint a service-account-token Secret for any account in the namespace,
or, on a fresh install, pre-seed the operator's `generate: true` Secrets before the
MariaDB object exists. This policy lets the account create exactly one Secret: the
configured `appPasswordSecret`, type `Opaque`, the hook's own labels, one `password`
key, and nothing else. Every other Secret CREATE by that account is denied. The
parent chart may set `createAppAccount` true only once this policy is live.

WHAT ADMISSION SEES (Kubernetes source, v1.36.1). The name is final: the registry's
`BeforeCreate` runs before validating admission. An empty `type` is already `Opaque`:
`SetDefaults_Secret` runs at decode. `stringData` is already folded into `data`: the
internal Secret has no `stringData`, so the object CEL reads carries `data.password`.
Server-set metadata (`uid`, `creationTimestamp`, `managedFields`) is present too, so
the policy checks named fields rather than the whole of `metadata`.

ONLY THE HOOK ACCOUNT MATCHES. The username test is a match condition, so every other
account evaluates it to false and skips the policy, and `failurePolicy: Fail` never
reaches it. The namespace selector bounds what a broken expression could deny to this
release's namespace.

CLUSTER-SCOPED, SO NAMED PER CHART AND NAMESPACE, ONE TO ONE WITH THE HOOK ACCOUNT.
That account's name carries no release either, so two releases of this chart in one
namespace already share it. The name `<chart>-app-password.<namespace>` cannot collide
across namespaces or charts: a namespace name carries no dot.

A HOOK, BEFORE THE RBAC AND THE JOB. Plain objects are applied after PreSync hooks,
so a plain policy would arrive after the Job on a fresh install. Wave and weight -20
put it before the RBAC triple (-10) and the Job (-5). The delete policy is
before-hook-creation alone: the policy stays after a successful sync, and each sync
replaces it before it re-creates the RBAC. Neither Argo nor `helm uninstall` prunes a
hook, so the policy outlives an uninstall. A later install in the same namespace
re-creates the same hook account, and the stale policy governs it again with the same
rule until that install's sync replaces it. That is harmless and fails closed.
*/}}
{{- if and .Values.database.create .Values.database.createAppAccount }}
{{- $hook := printf "%s-app-password-init" .Chart.Name }}
{{- $secret := .Values.database.appPasswordSecret }}
{{- $name := printf "%s-app-password.%s" .Chart.Name .Release.Namespace }}
{{- $labels := printf "{'app.kubernetes.io/component': 'app-password', 'app.kubernetes.io/created-by': '%s', 'app.kubernetes.io/name': '%s'}" $hook .Chart.Name }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $hook }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-20"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: the-hook-account
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" .Release.Namespace $hook | quote }}
  validations:
    - expression: {{ printf "object.metadata.name == '%s'" $secret | quote }}
      message: {{ printf "%s may create only the Secret %s" $hook $secret | quote }}
      reason: Forbidden
    - expression: "has(object.type) && object.type == 'Opaque'"
      message: {{ printf "%s may create only a Secret of type Opaque" $hook | quote }}
      reason: Forbidden
    - expression: {{ printf "has(object.metadata.labels) && object.metadata.labels == %s" $labels | quote }}
      message: {{ printf "%s may create only a Secret with exactly the app-password labels" $hook | quote }}
      reason: Forbidden
    - expression: "(!has(object.metadata.annotations) || size(object.metadata.annotations) == 0) && (!has(object.metadata.ownerReferences) || size(object.metadata.ownerReferences) == 0) && (!has(object.metadata.finalizers) || size(object.metadata.finalizers) == 0) && !has(object.immutable)"
      message: {{ printf "%s may not set annotations, ownerReferences, finalizers or immutable on the Secret" $hook | quote }}
      reason: Forbidden
    - expression: "has(object.data) && size(object.data) == 1 && 'password' in object.data"
      message: {{ printf "%s may create only a Secret whose one key is password" $hook | quote }}
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $hook }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-20"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
