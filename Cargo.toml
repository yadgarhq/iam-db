[package]
name = "yadgar-iam-db"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "The identity module's -db twin: the only writer of its store, serving IamDbService over gRPC."

[dependencies]
# Pinned by REVISION, not by tag or branch. store has no tags yet, and a branch
# is a moving target — the same reasoning that pins images by digest (D61) and
# actions by SHA (D62). Bumped deliberately, never drifting underneath a build.
yadgar-store = { git = "https://github.com/yadgarhq/store.git", rev = "4a479ddb5f775de718125d67d14fddbfea9bac12" }
# In tonic 0.14 prost codegen moved out to tonic-prost; there is no "prost"
# feature on tonic itself.
#
# `tls-ring`, NOT `tls-aws-lc`. aws-lc-rs needs cmake and a C toolchain, and this
# service builds for x86_64-unknown-linux-musl (D63); ring builds for musl with
# the toolchain already in the base image. It is the provider `yadgar-dial`
# already chose for the client side of this hop, so one serves both directions.
#
# The feature is what makes `ServerTlsConfig` exist; it does NOT turn TLS on.
# `serve::builder` binds a plaintext listener unless a deployment sets
# LISTEN_TLS_ENABLED, and every chart default leaves it unset.
tonic = { version = "0.14", default-features = false, features = [
  "codegen",
  "router",
  "server",
  "transport",
  "tls-ring",
] }
# The SAME PEM parser tonic itself uses on the certificate and the key, so "this
# file holds no certificate" is decided here rather than failing opaquely inside
# the acceptor. Present in the tree already by way of tokio-rustls; naming it
# directly costs nothing and is what lets `serve.rs` say WHICH of the two files
# an operator has to fix.
rustls-pki-types = { version = "1", features = ["std"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
# The shared instrumentation seam (D67), pinned by revision like every in-org crate.
yadgar-telemetry = { git = "https://github.com/yadgarhq/telemetry.git", rev = "1273e45e641c6af5187af1203dfb153d4369b5bc", features = ["grpc"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "mysql",
  "macros",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7"] }

# NO argon2, NO hmac and NO sha2, and that absence is D72 working. Every hash,
# HMAC and ciphertext this service stores was computed by `iam`, which holds the
# keys — so a submitted password, a plaintext username and a bearer token all
# reach a value this process could compare against only after `iam` has already
# transformed them. These three crates were declared here and never used by a
# line of code; keeping them would leave the tools for doing that work in the one
# process that must not be able to do it.

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
# `net` and `time` for the TLS rig in tests/serve_tls.rs: it binds its own
# listeners and waits for the port rather than sleeping a guessed interval.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
# Certificates are MINTED PER TEST RUN rather than checked in: a fixture key in
# the repository is a secret in the repository, and it expires on a date nobody
# is watching.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# Wraps a `TcpListener` the rig owns into the stream `serve_with_incoming` takes,
# which is how the same builder the binary uses gets served on a port the test
# chose. Dev-only, so the shipped tree is unchanged.
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
