[package]
name = "yadgar-iam-db"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "The identity module's -db twin: the only writer of its store, serving IamDbService over gRPC."

[dependencies]
# Pinned by RELEASE TAG, not by branch. store now publishes versions, and a
# published tag never moves in this organisation — a correction is a new tag —
# so `v0.2.0` names exactly one commit for as long as it exists, and Cargo.lock
# records the revision it resolved to. A branch is the moving target this
# refuses, the same reasoning that pins images by digest (D61) and actions by
# SHA (D62). Bumped deliberately, never drifting underneath a build.
#
# `v0.2.0` REFUSES `verify_ca` AT BOOT — a minor bump pre-1.0 because it removes
# a value the configuration used to take. The mode named a check sqlx does not
# perform: it accepted any publicly-trusted certificate for any name. Nothing in
# this estate runs it, so the refusal changes no deployment; `verify_identity`
# is the mode that binds the connection to the engine it names.
yadgar-store = { git = "https://github.com/yadgarhq/store.git", tag = "v0.2.0" }
# In tonic 0.14 prost codegen moved out to tonic-prost; there is no "prost"
# feature on tonic itself.
#
# `tls-ring`, NOT `tls-aws-lc`. aws-lc-rs needs cmake and a C toolchain, and this
# service builds for x86_64-unknown-linux-musl (D63); ring builds for musl with
# the toolchain already in the base image. It is the provider `yadgar-dial`
# already chose for the client side of this hop, so one serves both directions.
#
# The feature is what makes `ServerTlsConfig` exist; it does NOT turn TLS on.
# `serve::builder` binds a plaintext listener unless a deployment sets
# LISTEN_TLS_ENABLED, and every chart default leaves it unset.
tonic = { version = "0.14", default-features = false, features = [
  "codegen",
  "router",
  "server",
  "transport",
  "tls-ring",
] }
# The SAME PEM parser tonic itself uses on the certificate and the key, so "this
# file holds no certificate" is decided here rather than failing opaquely inside
# the acceptor. Present in the tree already by way of tokio-rustls; naming it
# directly costs nothing and is what lets `serve.rs` say WHICH of the two files
# an operator has to fix.
rustls-pki-types = { version = "1", features = ["std"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
# The shared instrumentation seam (D67), pinned by release tag like every in-org
# crate. This repository sat one commit behind every other consumer until now —
# a bare revision in five files has nothing that notices one falling behind.
yadgar-telemetry = { git = "https://github.com/yadgarhq/telemetry.git", tag = "v0.1.5", features = ["grpc"] }
# WHICH SIGNALS END THIS PROCESS, decided once for the estate rather than once
# per repository (ADR-0526's pin, D19's rule). `shutdown` stood in five copies
# before this crate existed and was wrong in every one of them for the same
# reason — SIGINT alone, which Kubernetes never sends.
#
# ALL THREE UNITS, AND THEY ARE ONE UNIT. `rotate::watch` and `shutdown` are the
# two arms of one `select!`, and whichever wins, `drain_within` bounds what
# follows. This manifest used to carry `default-features = false`, which
# compiled `rotate` out, on the reasoning that nothing here ends the serving
# future on its own — true of the drain, and never true of the certificate.
#
# TAKING THE WATCHER BACK COSTS THE CERTIFICATE-PARSING TREE: `x509-parser` over
# `asn1-rs`, `der-parser`, `oid-registry` and `nom`, plus `sha2` and the
# `metrics` facade. The dependency subtree of this crate goes from 20 to 58
# packages, which is what the original flag was buying. It buys the wrong thing:
# `iam-db-tls` expires 2026-12-01T19:35:07Z, cert-manager renews it, and a
# process that read its leaf once at boot presents the old one until something
# restarts it. See `src/rotate.rs`.
#
# THE DRAIN BUDGET COMES WITH IT, NOT AFTER IT. tokio never unregisters a libc
# signal handler, so once the rotation arm wins the `select!` a later SIGTERM is
# swallowed and only SIGKILL remains — the watcher WITHOUT `drain_within` is the
# bug, not half the fix.
yadgar-lifecycle = { git = "https://github.com/yadgarhq/lifecycle.git", tag = "v0.2.3" }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "mysql",
  "macros",
] }
# NO `signal` FEATURE. It was here for `serve::shutdown`, which is now
# `yadgar_lifecycle::shutdown` — and that crate declares the feature it needs.
# Cargo features are additive, so the built tree is unchanged; what is removed
# is a manifest line claiming this crate handles signals itself.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7"] }

# NO argon2, NO hmac and NO sha2, and that absence is D72 working. Every hash,
# HMAC and ciphertext this service stores was computed by `iam`, which holds the
# keys — so a submitted password, a plaintext username and a bearer token all
# reach a value this process could compare against only after `iam` has already
# transformed them. These three crates were declared here and never used by a
# line of code; keeping them would leave the tools for doing that work in the one
# process that must not be able to do it.

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
# `net` and `time` for the TLS rig in tests/serve_tls.rs: it binds its own
# listeners and waits for the port rather than sleeping a guessed interval.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
# Certificates are MINTED PER TEST RUN rather than checked in: a fixture key in
# the repository is a secret in the repository, and it expires on a date nobody
# is watching.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# Wraps a `TcpListener` the rig owns into the stream `serve_with_incoming` takes,
# which is how the same builder the binary uses gets served on a port the test
# chose. Dev-only, so the shipped tree is unchanged.
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
