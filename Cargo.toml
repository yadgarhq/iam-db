[package]
name = "yadgar-iam-db"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "The identity module's -db twin: the only writer of its store, serving IamDbService over gRPC."

[dependencies]
# Pinned by REVISION, not by tag or branch. store has no tags yet, and a branch
# is a moving target — the same reasoning that pins images by digest (D61) and
# actions by SHA (D62). Bumped deliberately, never drifting underneath a build.
yadgar-store = { git = "https://github.com/yadgarhq/store.git", rev = "4a479ddb5f775de718125d67d14fddbfea9bac12" }
# In tonic 0.14 prost codegen moved out to tonic-prost; there is no "prost"
# feature on tonic itself. Also no TLS feature here: the gateway terminates
# outward TLS, and in-cluster hops are plain HTTP/2 today (D23).
tonic = { version = "0.14", default-features = false, features = [
  "codegen",
  "router",
  "server",
  "transport",
] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
# The shared instrumentation seam (D67), pinned by revision like every in-org crate.
yadgar-telemetry = { git = "https://github.com/yadgarhq/telemetry.git", rev = "1273e45e641c6af5187af1203dfb153d4369b5bc", features = ["grpc"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "mysql",
  "macros",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7"] }

# NO argon2, NO hmac and NO sha2, and that absence is D72 working. Every hash,
# HMAC and ciphertext this service stores was computed by `iam`, which holds the
# keys — so a submitted password, a plaintext username and a bearer token all
# reach a value this process could compare against only after `iam` has already
# transformed them. These three crates were declared here and never used by a
# line of code; keeping them would leave the tools for doing that work in the one
# process that must not be able to do it.

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
